name: Code Quality

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - qatest 
      - staging
      - main

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Python syntax
        run: |
          python -m compileall -q .

      - name: Run Ruff lint
        run: |
          ruff check . --output-format=github

      - name: Check code formatting
        run: |
          ruff format --check .

      - name: Check final newline
        shell: bash
        run: |
          failed=0

          while IFS= read -r -d '' file; do
            if [ -s "$file" ]; then
              last_byte=$(tail -c 1 "$file" | od -An -t x1 | tr -d ' ')

              if [ "$last_byte" != "0a" ]; then
                echo "::error file=$file::File does not end with a newline"
                failed=1
              fi
            fi
          done < <(
            find . -type f -name "*.py" \
              ! -path "./.git/*" \
              ! -path "./.venv/*" \
              ! -path "./venv/*"
          )

          exit $failed